<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<!-- Icons are already generated in public/. Only needed if you change the design.
     Save each download into public/. -->
<canvas id="c192" width="192" height="192" style="border:1px solid #ccc;margin:10px"></canvas>
<canvas id="c512" width="512" height="512" style="border:1px solid #ccc;margin:10px"></canvas>
<canvas id="cmask" width="512" height="512" style="border:1px solid #ccc;margin:10px"></canvas>
<canvas id="c180" width="180" height="180" style="border:1px solid #ccc;margin:10px"></canvas>
<br>
<button onclick="download('c192','icon-192.png')">Download icon-192.png</button>
<button onclick="download('c512','icon-512.png')">Download icon-512.png</button>
<button onclick="download('cmask','icon-maskable-512.png')">Download icon-maskable-512.png</button>
<button onclick="download('c180','icon-180.png')">Download icon-180.png</button>
<script>
// opts.square: fill the whole canvas (iOS and Android apply their own corner mask)
// opts.scale:  shrink the artwork so it fits Android's maskable safe zone (inner 80% circle)
function drawIcon(canvas, opts) {
  opts = opts || {};
  var full = canvas.width;
  var ctx = canvas.getContext('2d');
  if (opts.square) {
    ctx.fillStyle = '#3d2b0f'; ctx.fillRect(0, 0, full, full);
    // soil band runs edge to edge so the mask never shows a seam
    ctx.fillStyle = '#1a1208';
    var k = opts.scale || 1, off = full * (1 - k) / 2;
    ctx.fillRect(0, off + full * k * 0.76, full, full);
    ctx.fillStyle = '#2a1f0e';
    ctx.fillRect(0, off + full * k * 0.73, full, full * k * 0.05);
  }
  if (opts.scale) {
    ctx.save();
    ctx.translate(full * (1 - opts.scale) / 2, full * (1 - opts.scale) / 2);
    ctx.scale(opts.scale, opts.scale);
  }
  var s = full;
  var r = opts.square ? 0 : s * 0.16;

  // Background rounded rect
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(s-r, 0); ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s-r); ctx.quadraticCurveTo(s, s, s-r, s);
  ctx.lineTo(r, s); ctx.quadraticCurveTo(0, s, 0, s-r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#3d2b0f'; ctx.fill();
  if (!opts.square) ctx.clip();   // keep the soil band inside the rounded corners

  // Soil
  ctx.fillStyle = '#1a1208';
  ctx.fillRect(0, s*0.76, s, s*0.24);

  // Dividing line
  ctx.fillStyle = '#2a1f0e';
  ctx.fillRect(0, s*0.73, s, s*0.05);

  // Stalks
  ctx.strokeStyle = '#c8922a'; ctx.lineWidth = s*0.012; ctx.lineCap = 'round';
  var stalks = [0.23, 0.39, 0.5, 0.61, 0.77];
  var heights = [0.56, 0.46, 0.40, 0.46, 0.56];
  stalks.forEach(function(x, i) {
    ctx.beginPath(); ctx.moveTo(s*x, s*0.73); ctx.lineTo(s*x, s*heights[i]); ctx.stroke();
  });

  // Wheat heads
  ctx.fillStyle = '#e8b84b';
  stalks.forEach(function(x, i) {
    var cy = s*heights[i];
    var rx = s*0.028, ry = s*0.056;
    // Center kernel
    ctx.beginPath(); ctx.ellipse(s*x, cy - ry*0.5, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    // Side kernels
    ctx.beginPath(); ctx.ellipse(s*x - rx*1.4, cy + ry*0.2, rx*0.8, ry*0.8, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*x + rx*1.4, cy + ry*0.2, rx*0.8, ry*0.8, 0.3, 0, Math.PI*2); ctx.fill();
  });

  // FR text
  ctx.fillStyle = '#f2d98a';
  ctx.font = 'bold ' + Math.round(s*0.18) + 'px Arial Black, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = s*0.02 + 'px';
  ctx.fillText('FR', s*0.5, s*0.885);
  if (opts.scale) ctx.restore();
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
drawIcon(document.getElementById('cmask'), {square: true, scale: 0.8});
drawIcon(document.getElementById('c180'), {square: true});

function download(id, name) {
  var a = document.createElement('a');
  a.href = document.getElementById(id).toDataURL('image/png');
  a.download = name; a.click();
}
</script>
</body>
</html>
